name: tests

on:
  push:
  pull_request:

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Only what's needed to import and run the fast/mocked tests -- not the
      # full requirements.txt, which also pulls in audio/vision/GUI packages
      # (sounddevice, piper-tts, pywebview, ...) that need system libraries
      # this runner doesn't have and that the fast tests don't exercise.
      - run: pip install langchain==1.3.10 langchain-core==1.4.8 langchain-ollama==1.1.0 langgraph==1.2.6 langgraph-checkpoint==4.1.1 python-dotenv==1.2.2 requests==2.34.2 pytest==9.1.0
      # Only the mocked tests -- the rest call a real local Ollama model and
      # aren't meant to run in CI (see tests/test_simplify.py docstring).
      - run: python -m pytest tests/ -m "not requires_ollama" -v

  windows-build:
    # Verifies the standalone .exe still builds on every push -- this broke
    # silently more than once during development (Streamlit's dynamic script
    # loading + frozen-app detection, see README "As a standalone .exe").
    # Doesn't run the app (needs Ollama + real models), just confirms
    # PyInstaller can produce the .exe without erroring.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: pyinstaller desktop.spec --noconfirm
      - run: |
          if (-not (Test-Path "dist\AccessibilityAssistant\AccessibilityAssistant.exe")) {
            Write-Error "Build did not produce AccessibilityAssistant.exe"
            exit 1
          }
        shell: pwsh
